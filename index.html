
<!doctype html>
<html lang="es"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HMI IRCA</title>
<style>
:root{--bg:#0a1017;--p:#111b26;--l:#203549;--c:#19c6d1;--t:#d7e4ee;--m:#7e97ab;--ok:#2fd27a;--w:#f5b83d;--e:#ff4d4d}
*{box-sizing:border-box}
body{margin:0;height:100vh;background:var(--bg);color:var(--t);font:14px/1.3 system-ui,sans-serif;display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;padding:8px}
.card{background:var(--p);border:1px solid var(--l);border-radius:8px;padding:10px}
h1{margin:0;font-size:20px;letter-spacing:.5px;flex:1}
h3{margin:0 0 8px;font-size:12px;color:var(--m);letter-spacing:1px;text-transform:uppercase}
header{display:flex;align-items:center;gap:10px}
.chip{padding:3px 10px;border-radius:99px;border:1px solid var(--l);font-size:12px;color:var(--m);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.w{color:var(--w);border-color:var(--w)}.chip.bad{color:var(--e);border-color:var(--e)}
#tabs{display:flex;gap:6px}
#tabs div{flex:1;text-align:center;padding:6px 2px;border:1px solid var(--l);border-radius:6px;font-size:12px;color:var(--m);background:var(--p)}
#tabs div.on{border-color:var(--c);color:var(--c);box-shadow:0 0 8px #19c6d155}
#tabs div.hecha{color:var(--ok)}
main{display:grid;grid-template-columns:230px 1fr 270px;gap:8px;min-height:0}
.col{display:flex;flex-direction:column;gap:8px;min-height:0}
.sl{margin-bottom:12px}.sl label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--c)}
select,.mini{width:100%;padding:6px;margin-bottom:8px;background:#0a1017;color:var(--t);border:1px solid var(--l);border-radius:6px}
#vista{position:relative;overflow:hidden;padding:0;background:radial-gradient(ellipse at 50% 40%,#16283a,#0a1017 75%)}
#vista canvas{position:absolute;inset:0}
#msg{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:var(--m);font-size:13px;pointer-events:none;display:none}
#tag{position:absolute;left:10px;top:8px;font-size:12px;color:var(--m)}
#camBox{aspect-ratio:4/3;background:#000;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--m);font-size:12px}
#camBox img{width:100%;height:100%;object-fit:cover}
.kv{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--l)}
.kv b{color:var(--c)}
#log{flex:1;overflow:auto;font:12px ui-monospace,monospace;color:var(--m)}
#log p{margin:0 0 3px}#log .e{color:var(--e)}#log .w{color:var(--w)}
footer{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
#bar{height:16px;background:#0a1017;border:1px solid var(--l);border-radius:8px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0e8d96,var(--c))}
#pct{font-size:12px;color:var(--m);margin-bottom:4px}
.btns{display:flex;gap:8px}
.btns button{padding:10px 16px;border-radius:6px;border:1px solid var(--l);background:var(--p);color:var(--t);font-weight:700;font-size:13px}
#bI{border-color:var(--ok);color:var(--ok)}#bP{border-color:var(--w);color:var(--w)}#bE{background:var(--e);color:#fff;border-color:var(--e)}
</style>
<body>
<header class="card">
  <h1 id="tit">ESTACIÓN 1</h1>
  <span class="chip" id="chSis">SISTEMA: PARO</span>
  <span class="chip w" id="chEsp">ESP32: modo demo</span>
  <span class="chip" id="reloj">--:--:--</span>
</header>
<div id="tabs"></div>
<main>
  <div class="col">
    <div class="card">
      <h3>Brazo</h3>
      <select id="sel"></select>
      <div class="sl"><label>Base (j1) <b id="v0">90</b></label><input id="s0" type="range" min="0" max="180" value="90"></div>
      <div class="sl"><label>Hombro (j2) <b id="v1">90</b></label><input id="s1" type="range" min="0" max="180" value="90"></div>
      <div class="sl"><label>Codo (j3) <b id="v2">90</b></label><input id="s2" type="range" min="0" max="180" value="90"></div>
      <label><input type="checkbox" id="man"> Control manual</label>
      <div style="color:var(--m);font-size:12px;margin:6px 0 10px">90° = posición de reposo</div>
      <button class="mini" id="vG">Vista general</button>
      <button class="mini" id="vB">Enfocar brazo activo</button>
    </div>
    <div class="card" style="flex:1"><h3>Etapa</h3>
      <div class="kv"><span>Brazos</span><b id="nb">-</b></div>
      <div class="kv"><span>Tiempo etapa</span><b id="te">0.0 s</b></div>
      <div class="kv"><span>Carros terminados</span><b id="car">0</b></div>
    </div>
  </div>
  <div class="card" id="vista"><span id="tag">Celda a escala 1:10 · 6 brazos</span><div id="msg">Sin brazo en esta etapa</div></div>
  <div class="col">
    <div class="card"><h3>Cámara</h3><div id="camBox">Sin señal (usa ?cam=URL)</div></div>
    <div class="card" style="flex:1;display:flex;flex-direction:column;min-height:0"><h3>Bitácora</h3><div id="log"></div></div>
  </div>
</main>
<footer class="card">
  <div><div id="pct">Progreso: 0 %</div><div id="bar"><i id="barI"></i></div></div>
  <div class="btns"><button id="bI">INICIO</button><button id="bP">PARO</button><button id="bR">REINICIO</button><button id="bE">EMERGENCIA</button></div>
</footer>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {STLLoader} from 'three/addons/loaders/STLLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id);

// ---------- ETAPAS (a = brazos que trabajan a la vez, sec = sección de la mesa 0-3, k = poses [base,hombro,codo], 90 = reposo) ----------
const H=[90,90,90], D=10;   // D = segundos por etapa en modo demo
const ETAPAS=[
 {n:'INGRESO DE ESTRUCTURA',a:[],sec:null},
 {n:'SOLDADURA DE CHASIS',a:[1,2],sec:0,k:[H,[70,75,110],[70,60,125],[110,75,110],[110,60,125],H]},
 {n:'SALPICADERAS',a:[3,4],sec:1,k:[H,[60,80,100],[60,65,115],[120,80,100],[120,65,115],H]},
 {n:'COFRE Y DEFENSA',a:[3,4],sec:1,k:[H,[90,70,115],[90,55,130],[90,70,115],H]},
 {n:'PARABRISAS Y VIDRIO TRASERO',a:[5,6],sec:2,k:[H,[75,80,105],[75,65,120],[105,80,105],H]},
 {n:'SISTEMA MECÁNICO',a:[],sec:3},
 {n:'PUERTAS',a:[5,6],sec:2,k:[H,[55,75,110],[55,60,125],[125,75,110],[125,60,125],H]},
];
const tabs=$('tabs');
ETAPAS.forEach((e,i)=>tabs.insertAdjacentHTML('beforeend',`<div>${i+1}. ${e.n.split(' ')[0]}</div>`));

// ---------- DISTRIBUCIÓN DE LA MESA (metros) ----------
const ANCHO=1.5, ALTO=0.9, SEC=ANCHO/4, DLADO=0.30;   // 4 secciones iguales; brazos a ±30 cm de la banda
const LAY=[ [1,0,-1],[2,0,1],[3,1,-1],[4,1,1],[5,2,-1],[6,2,1] ];  // [brazo, sección, lado]; la sección 3 queda para el elevador

// ---------- CALIBRACIÓN DEL BRAZO (mm, ejes del CAD) ----------
const P={j1:new THREE.Vector3(78,148,46),j2:new THREE.Vector3(112,105,95),j3:new THREE.Vector3(206.5,150,94)};
const AJ={j2:new THREE.Vector3(3.6,0,0),j3:new THREE.Vector3(-6.2,0,0)};
const signo=[1,1,1];

// ---------- ESCENA ----------
const vista=$('vista');
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(40,1,0.05,20);
const rd=new THREE.WebGLRenderer({antialias:true,alpha:true});vista.prepend(rd.domElement);
const ctl=new OrbitControls(cam,rd.domElement);
function vistaGeneral(){cam.position.set(ANCHO/2,1.3,1.3);ctl.target.set(ANCHO/2,0,0)}
vistaGeneral();
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,2));
const sun=new THREE.DirectionalLight(0xffffff,1.5);sun.position.set(1,2,1.5);scene.add(sun);
new ResizeObserver(()=>{const w=vista.clientWidth,h=vista.clientHeight;rd.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}).observe(vista);

// mesa
const mesa=new THREE.Mesh(new THREE.BoxGeometry(ANCHO,0.01,ALTO),new THREE.MeshStandardMaterial({color:0x0e1822}));
mesa.position.set(ANCHO/2,-0.005,0);scene.add(mesa);
const borde=new THREE.LineSegments(new THREE.EdgesGeometry(mesa.geometry),new THREE.LineBasicMaterial({color:0x2b4660}));
borde.position.copy(mesa.position);scene.add(borde);
// secciones (resaltan la que trabaja)
const pads=[];
for(let i=0;i<4;i++){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(SEC-.01,ALTO-.01),new THREE.MeshBasicMaterial({color:0x19c6d1,transparent:true,opacity:.05}));
  m.rotation.x=-Math.PI/2;m.position.set((i+.5)*SEC,.002,0);scene.add(m);pads.push(m);
}
// banda
const banda=new THREE.Mesh(new THREE.PlaneGeometry(ANCHO,0.12),new THREE.MeshBasicMaterial({color:0x1a2a3a}));
banda.rotation.x=-Math.PI/2;banda.position.set(ANCHO/2,.004,0);scene.add(banda);
// divisiones y rótulos
const pts=[];for(let k=1;k<4;k++)pts.push(new THREE.Vector3(k*SEC,.006,-ALTO/2),new THREE.Vector3(k*SEC,.006,ALTO/2));
scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x2b4660})));
function rotulo(txt,x){
  const c=document.createElement('canvas');c.width=512;c.height=64;const g=c.getContext('2d');
  g.fillStyle='#7e97ab';g.font='bold 34px system-ui';g.textAlign='center';g.fillText(txt,256,44);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(.3,.0375),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true}));
  m.rotation.x=-Math.PI/2;m.position.set(x,.008,ALTO/2-.03);scene.add(m);
}
['SECCIÓN 1','SECCIÓN 2','SECCIÓN 3','ELEVADOR'].forEach((t,i)=>rotulo(t,(i+.5)*SEC));
// marcador del elevador (sección 4)
const elev=new THREE.Mesh(new THREE.BoxGeometry(.22,.2,.22),new THREE.MeshStandardMaterial({color:0x19c6d1,transparent:true,opacity:.12}));
elev.position.set(SEC*3.5,.1,0);
const eb=new THREE.LineSegments(new THREE.EdgesGeometry(elev.geometry),new THREE.LineBasicMaterial({color:0x19c6d1}));
eb.position.copy(elev.position);scene.add(elev,eb);

// ---------- 6 BRAZOS (4 STL cargados una sola vez y compartidos) ----------
const GEO={},arms={};
function crearBrazo(id,sec,lado){
  const w=new THREE.Group();
  w.position.set((sec+.5)*SEC,0,lado*DLADO);
  w.rotation.y=lado*Math.PI/2;                         // el brazo mira hacia la banda
  const cad=new THREE.Group();cad.rotation.x=-Math.PI/2;cad.scale.setScalar(0.001);
  cad.position.set(-0.078,0,0.150);w.add(cad);        // centra la base del CAD en el origen
  const j1=new THREE.Group(),j2=new THREE.Group(),j3=new THREE.Group();
  cad.add(j1);j1.add(j2);j2.add(j3);
  j1.position.copy(P.j1);j2.position.copy(P.j2).sub(P.j1);j3.position.copy(P.j3).sub(P.j2);
  const mk=(n,c,par,o,aj)=>{if(!GEO[n])return null;
    const m=new THREE.Mesh(GEO[n],new THREE.MeshStandardMaterial({color:c,roughness:.6}));
    if(o)m.position.copy(o).negate();if(aj)m.position.add(aj);par.add(m);return m.material};
  const mats=[mk('Base_219',0x8a97a3,cad),mk('Brazo_1',0xff8a00,j1,P.j1),
              mk('Brazo_2',0x33aaff,j2,P.j2,AJ.j2),mk('Brazo_3',0x66dd66,j3,P.j3,AJ.j3)].filter(Boolean);
  // el brazo de un lado gira la base en sentido contrario para que el par se mueva en espejo
  scene.add(w);arms[id]={w,j1,j2,j3,mats,sg:[lado*signo[0],signo[1],signo[2]]};
}
const ld=new STLLoader();
Promise.all(['Base_219','Brazo_1','Brazo_2','Brazo_3'].map(n=>new Promise(ok=>
  ld.load(n+'.stl',g=>{GEO[n]=g;ok()},undefined,()=>{log('No cargó '+n+'.stl','e');ok()})
))).then(()=>{LAY.forEach(([id,sec,lado])=>crearBrazo(id,sec,lado));pintaEtapa();aplicarTodos()});

// ---------- POSE DE SERVOS ----------
const servo=Array.from({length:7},()=>[90,90,90]);   // índice = número de brazo (1-6)
let sel=1;
$('sel').innerHTML=LAY.map(([id,sec])=>`<option value="${id}">Brazo ${id} (sección ${sec+1})</option>`).join('');
function aplicarPose(n){
  const a=arms[n],s=servo[n];
  if(a){const r=i=>(s[i]-90)*a.sg[i]*Math.PI/180;a.j1.rotation.z=r(0);a.j2.rotation.y=r(1);a.j3.rotation.y=r(2)}
  if(n===sel)[0,1,2].forEach(i=>{$('v'+i).textContent=Math.round(s[i]);$('s'+i).value=s[i]});
}
const aplicarTodos=()=>[1,2,3,4,5,6].forEach(aplicarPose);
function setServos(n,a){if(!servo[n])return;a.forEach((v,i)=>servo[n][i]=v);aplicarPose(n)}
$('sel').onchange=e=>{sel=+e.target.value;aplicarPose(sel)};
[0,1,2].forEach(i=>$('s'+i).oninput=e=>{$('man').checked=true;servo[sel][i]=+e.target.value;aplicarPose(sel)});
$('vG').onclick=vistaGeneral;
// enfoca uno de los brazos que están trabajando (si trabajan en par, el primero)
$('vB').onclick=()=>{
  const e=ETAPAS[idx],n=e.a[0];
  if(!n){
    if(e.sec===3){ctl.target.set(SEC*3.5,.08,0);cam.position.set(SEC*3.5+.45,.4,.6)}
    else vistaGeneral();
    return;
  }
  sel=n;$('sel').value=n;aplicarPose(n);
  const p=arms[n].w.position;
  ctl.target.set(p.x,.1,p.z*.5);cam.position.set(p.x+.6,.22,p.z*.5);
};

// ---------- ESTADO DEL HMI ----------
let estado='paro',idx=0,t=0,carros=0,demo=true;
function log(msg,c=''){const d=new Date().toLocaleTimeString('es-MX',{hour12:false});
  $('log').insertAdjacentHTML('afterbegin',`<p class="${c}">[${d}] ${msg}</p>`)}
function chip(id,txt,c){const e=$(id);e.textContent=txt;e.className='chip '+c}
function pintaEtapa(){
  const e=ETAPAS[idx];
  $('tit').textContent=`ESTACIÓN ${idx+1}: ${e.n}`;
  [...tabs.children].forEach((d,i)=>d.className=i===idx?'on':i<idx?'hecha':'');
  $('nb').textContent=e.a.length?`${e.a.length} (${e.a.map(n=>'B'+n).join(', ')})`:(e.sec===3?'elevador':'0');
  $('msg').style.display=e.a.length?'none':'block';
  pads.forEach((p,i)=>p.material.opacity=i===e.sec?.22:.05);
  for(const id in arms)arms[id].mats.forEach(m=>m.emissive.setHex(e.a.includes(+id)?0x0b3d44:0));
}
function setEstado(s,txt,c){estado=s;chip('chSis','SISTEMA: '+txt,c)}
$('bI').onclick=()=>{if(estado==='emergencia'){log('Reinicia el sistema tras la emergencia','w');return}
  setEstado('marcha','MARCHA','ok');log('Inicio de ciclo')};
$('bP').onclick=()=>{if(estado==='marcha'){setEstado('paro','PARO','w');log('Paro solicitado','w')}};
$('bR').onclick=()=>{idx=0;t=0;[1,2,3,4,5,6].forEach(n=>setServos(n,H));pintaEtapa();setEstado('paro','PARO','');log('Sistema reiniciado')};
$('bE').onclick=()=>{setEstado('emergencia','EMERGENCIA','bad');log('PARO DE EMERGENCIA','e')};

// ---------- API PARA EL ESP32 / ROS ----------
window.hmi={servos:(n,a,b,c)=>setServos(n,[a,b,c]),etapa:n=>{idx=n-1;t=0;pintaEtapa();log('Etapa '+n)}};
const q=new URLSearchParams(location.search);
if(q.get('cam'))$('camBox').innerHTML=`<img src="${q.get('cam')}">`;
if(q.get('ws')){const conn=()=>{const w=new WebSocket(q.get('ws'));
  w.onopen=()=>{for(let n=1;n<=6;n++)w.send(JSON.stringify({op:'subscribe',topic:`/brazo_${n}/joint_states`,type:'sensor_msgs/JointState'}));
    chip('chEsp','ESP32: conectado','ok');demo=false;log('rosbridge conectado')};
  w.onmessage=e=>{const m=JSON.parse(e.data),n=+(m.topic||'').match(/brazo_(\d)/)?.[1];
    if(n&&m.msg?.position&&!(n===sel&&$('man').checked))setServos(n,m.msg.position.map(r=>r*180/Math.PI+90))};
  w.onclose=()=>{chip('chEsp','ESP32: sin conexión','bad');demo=true;setTimeout(conn,2000)}};conn()}

// ---------- LOOP ----------
const ease=s=>s*s*(3-2*s),clk=new THREE.Clock();
rd.setAnimationLoop(()=>{
  const dt=Math.min(clk.getDelta(),.1);
  $('reloj').textContent=new Date().toLocaleTimeString('es-MX',{hour12:false});
  if(estado==='marcha'){
    t+=dt;
    const e=ETAPAS[idx];
    if(demo&&e.k){
      const f=Math.min(t/D,.999)*(e.k.length-1),i=Math.floor(f),s=ease(f-i);
      const pose=e.k[i].map((v,j)=>v+(e.k[i+1][j]-v)*s);
      e.a.forEach(n=>{if(!(n===sel&&$('man').checked))setServos(n,pose)});
    }
    if(t>=D){log(`Etapa ${idx+1} terminada (${D.toFixed(1)} s)`);t=0;idx++;
      if(idx>=ETAPAS.length){idx=0;carros++;$('car').textContent=carros;log('Carro terminado','w')}
      pintaEtapa();log('Etapa '+(idx+1)+' iniciada')}
  }
  const pr=(idx+Math.min(t/D,1))/ETAPAS.length*100;
  $('barI').style.width=pr+'%';$('pct').textContent='Progreso: '+Math.round(pr)+' %';
  $('te').textContent=t.toFixed(1)+' s';
  ctl.update();rd.render(scene,cam);
});
pintaEtapa();log('HMI listo (modo demo)');
</script>
</html>
